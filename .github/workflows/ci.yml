name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (flux-core ${{ matrix.flux }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned release the code was developed against, plus the latest build.
        flux: [noble-v0.91.0, noble]
    container:
      image: fluxrm/flux-core:${{ matrix.flux }}
      # The image defaults to an unprivileged user that can't write the mounted workspace.
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      # Without git in the container, checkout downloads a tarball that can't take submodules.
      - name: Git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v5

      - name: Submodules and build tools
        env:
          SAGESTGIT_TOKEN: ${{ secrets.SAGESTGIT_TOKEN }}
        run: |
          scripts/ubuntu-runner/fetch-submodules.sh
          scripts/ubuntu-runner/install-deps.sh

      - name: Versions
        run: |
          flux version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: build/ubuntu-runner/deps
          key: deps-${{ matrix.flux }}-${{ hashFiles('scripts/common/build.sh') }}

      # Builds HashBrick and euler-miniapp, then runs every test in Flux, failing on skips.
      - name: Build and test
        run: scripts/ubuntu-runner/test.sh

  # No GPU on GitHub's runners, so this only checks that the CUDA code still compiles.
  cuda-build:
    name: build (CUDA ${{ matrix.cuda }}, compile only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.8.1"]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v5

      - name: Submodules and build tools
        env:
          SAGESTGIT_TOKEN: ${{ secrets.SAGESTGIT_TOKEN }}
        run: |
          scripts/ubuntu-runner/fetch-submodules.sh
          scripts/ubuntu-runner/install-deps.sh
          nvcc --version

      - uses: actions/cache@v4
        with:
          path: build/ubuntu-runner/deps
          key: deps-cuda-${{ matrix.cuda }}-${{ hashFiles('scripts/common/build.sh') }}

      # A100 (Perlmutter) and GH200; each rebuilds HashBrick and euler-miniapp from clean.
      - name: Build HashBrick, euler-miniapp and libMLEF for sm_80
        run: scripts/ubuntu-runner/build.sh --cuda --cuda-arch 80
      - name: Build HashBrick, euler-miniapp and libMLEF for sm_90
        run: scripts/ubuntu-runner/build.sh --cuda --cuda-arch 90
